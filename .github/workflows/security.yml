name: Security checks
on:
  pull_request:
  push:
    branches: [main, beta]
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test and package
        run: ./gradlew clean test buildFatJar
      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          find src/main/resources/static/frontend -name '*.js' -print0 |
            xargs -0 -n1 node --check
      - name: Require NVD API key
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: test -n "$NVD_API_KEY"
      - name: Dependency vulnerability scan
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAnalyze
      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dependency-check-${{ github.sha }}
          path: build/reports/dependency-check/
          if-no-files-found: warn
      - name: Secret scan
        if: always()
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner
      - name: Upload deployable JAR
        uses: actions/upload-artifact@v6
        with:
          name: aitsm-${{ github.sha }}
          path: build/libs/aitsm-all.jar
          if-no-files-found: error
